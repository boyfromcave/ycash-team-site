# check: on every pull request, build public/ and check it (make check: HTML nesting, the strict
# CSP's rules, accessibility basics, internal links; make links: the same plus every external link).
# Copyright (c) 2026 The Ycash developers. MIT licence (LICENSE).
# No secrets, no AWS, read-only token. The deploy workflow runs make check again before it uploads.
name: check
on:
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: make check
      - run: make links
